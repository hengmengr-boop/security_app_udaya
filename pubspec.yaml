name: udaya_visitor
description: "Udaya Technology visitor management app (phone + laptop)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  easy_localization: ^3.0.8
  flutter_svg: ^2.3.0
  lucide_icons_flutter: ^3.1.14+2
  lottie: ^3.3.3
  url_launcher: ^6.3.2
  device_preview_plus: ^2.9.7
  dio: ^5.9.2
  flutter_bloc: ^9.1.1
  go_router: ^17.3.0
  retrofit: ^4.9.2
  json_annotation: ^4.12.0
  json_serializable: ^6.14.0
  talker_dio_logger: ^5.1.20
  shared_preferences: ^2.5.5

  # QR code shown for each visitor
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.1
  dependency_validator: ^5.0.5
  change_app_package_name: ^1.5.0
  build_runner: 2.15.1
  retrofit_generator: ^10.2.6

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - assets/translations/

# ── Launcher icon generation (run: dart run flutter_launcher_icons) ──
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 48
  macos:
    generate: true
  min_sdk_android: 21

# ── Native splash generation (run: dart run flutter_native_splash:create) ──
flutter_native_splash:
  color: "#241F63"
  image: assets/images/app_icon.png
  android_12:
    color: "#241F63"
    image: assets/images/app_icon.png
